<div class="forms-container">
  <div class="form-actions">
    <div class="submit-section">
      @if (!isSubmitting) {
        <button
          (click)="onSubmit()"
          class="btn btn-primary"
          [disabled]="form.invalid">
          Submit all forms
        </button>
        @if (invalidFormsCount > 0) {
          <span class="invalid-count">Invalid forms: {{ invalidFormsCount }}</span>
        }
      }
      @if (isSubmitting) {
        <button
          type="button"
          class="btn btn-danger"
          (click)="cancelSubmission()">
          Cancel
        </button>
        @if (timerActive) {
          <span class="timer-display">0:{{ timeRemaining }}s</span>
        }
      }
    </div>
  </div>
  <form [formGroup]="form">
    <div formArrayName="forms" class="forms-grid">
      @for (formGroup of formsArray.controls; track $index; let i = $index) {
        <div
          [formGroupName]="i"
          class="form-card">
          <div class="form-body">
            <app-country-input
              label="Country"
              inputId="country-{{i}}"
              placeholder="Select country"
              formControlName="country"
              [control]="formGroup.get('country')!"
              fieldName="Country"
            ></app-country-input>

            <app-text-input
              label="Username"
              inputId="username-{{i}}"
              placeholder="Enter username"
              formControlName="username"
              [control]="formGroup.get('username')!"
              fieldName="Username"
            ></app-text-input>

            <app-datepicker
              label="Birthday"
              inputId="birthday-{{i}}"
              formControlName="birthday"
              [control]="formGroup.get('birthday')!"
              fieldName="Birthday"
            ></app-datepicker>
          </div>
        </div>
      }
      @if (formsArray.length < 10) {
        <button
          type="button"
          class="add-form-btn btn-primary"
          (click)="addForm()">
          Add new form
        </button>
      }
    </div>
  </form>
</div>
