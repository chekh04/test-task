<div class="forms-container">
  <div class="form-actions">
    <div class="submit-section">
      @if (!isSubmitting) {
        <button
          (click)="onSubmit()"
          class="btn btn-primary"
          [disabled]="form.invalid">
          Submit all forms
        </button>
        @if (invalidFormsCount > 0) {
          <span class="invalid-count">Invalid forms: {{ invalidFormsCount }}</span>
        }
      }
      @if (isSubmitting) {
        <button
          type="button"
          class="btn btn-danger"
          (click)="cancelSubmission()">
          Cancel
        </button>
        @if (timerActive) {
          <span class="timer-display">0:{{ timeRemaining }}s</span>
        }
      }
    </div>
  </div>
  <form [formGroup]="form">
    <div formArrayName="forms" class="forms-grid">
      @for (formData of formsData; track formData.id; let i = $index) {
        <div
          [formGroupName]="i"
          class="form-card">
          <div class="form-body">
              <app-country-input
                label="Country"
                inputId="country-{{formData.id}}"
                placeholder="Select country"
                formControlName="country"
                [control]="formData.formGroup.get('country')!"
                fieldName="Country"
              ></app-country-input>
              @if (formsArray.length > 1) {
                <button
                  type="button"
                  class="btn-close"
                  (click)="removeForm(formData.id)"
                  title="Remove form">
                  ×
                </button>
              }

            <app-text-input
              label="Username"
              inputId="username-{{formData.id}}"
              placeholder="Enter username"
              formControlName="username"
              [control]="formData.formGroup.get('username')!"
              fieldName="Username"
            ></app-text-input>

            <app-datepicker
              label="Birthday"
              inputId="birthday-{{formData.id}}"
              formControlName="birthday"
              [control]="formData.formGroup.get('birthday')!"
              fieldName="Birthday"
            ></app-datepicker>
          </div>
        </div>
      }
      @if (canAddMoreForms) {
        <button
          type="button"
          class="add-form-btn btn-primary"
          (click)="addForm()">
          Add new form
        </button>
      }
    </div>
  </form>
</div>
